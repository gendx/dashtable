[package]
name = "dashtable"
description = "A concurrent raw hash table"
version = "0.3.0"
authors = ["Guillaume Endignoux <ggendx@gmail.com>"]
license = "MIT"
repository = "https://github.com/gendx/dashtable"
categories = ["concurrency", "algorithms", "data-structures"]
keywords = ["concurrent", "hashmap", "container", "collection"]
exclude = [".github/*"]
edition = "2024"
rust-version = "1.95.0"

[package.metadata.docs.rs]
features = ["get-size2"]
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]

[features]
default = []
get-size2 = ["dep:get-size2"]

[dependencies]
crossbeam-utils = "0.8.23"
get-size2 = { optional = true, version = "0.11.1", default-features = false, features = ["hashbrown"] }
hashbrown = "0.17.1"
lock_api = "0.5.0"
parking_lot = "0.13.0"
